<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recetario · Cotizador de Pasteles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.76.1/dist/umd/supabase.js"></script>
<style>
:root{
  --surface:#fbf7ec;--surface-raised:#fffdf7;--surface-sunken:#f3ead5;--cream:#ecdfbf;--border:#e2d6b8;--border-strong:#8f866e;
  --ink:#2e2a1f;--ink-muted:#6a6150;--olive:#5a6630;--olive-strong:#434c22;--olive-soft:#e3e7cc;--on-olive:#fbf7ec;
  --caramel:#b07a3c;--caramel-strong:#7a4818;--caramel-soft:#f5e3c8;--danger:#9e3326;--danger-soft:#f6ddd6;
  --shadow-card:0 1px 2px rgba(46,42,31,.06),0 6px 18px rgba(46,42,31,.06);
  --font-display:"Fraunces",Georgia,serif;--font-sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:8px;--r-md:14px;--r-lg:22px;
}
@media (prefers-color-scheme:dark){:root{
  --surface:#1d1e16;--surface-raised:#27291e;--surface-sunken:#16170f;--cream:#e9dcbc;--border:#3a3d2d;--border-strong:#7d7862;
  --ink:#f2ebd8;--ink-muted:#b9b29c;--olive:#a7b46c;--olive-strong:#c3cf8a;--olive-soft:#333a1f;--on-olive:#1d1e16;
  --caramel:#d39a58;--caramel-strong:#e0ab6e;--caramel-soft:#3a2c1b;--danger:#ec9284;--danger-soft:#3b201b;--shadow-card:0 1px 2px rgba(0,0,0,.4);
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--ink);font:400 16px/24px var(--font-sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-muted)}
.small{font-size:13px;line-height:18px}
[hidden]{display:none!important}

/* Barra superior */
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--border)}
.top-in{max-width:1120px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font:700 22px/1 var(--font-display);color:var(--olive-strong);margin-right:auto}
.tabs{display:flex;gap:4px;background:var(--surface-sunken);padding:4px;border-radius:999px}
.tab{appearance:none;border:0;background:transparent;padding:8px 16px;border-radius:999px;font-weight:600;font-size:15px;color:var(--ink-muted);cursor:pointer;min-height:40px}
.tab[aria-selected="true"]{background:var(--olive);color:var(--on-olive)}
.user{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.user .muted{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
@media (max-width:560px){.top-in{gap:8px 12px}.tabs{order:3;width:100%}.tab{flex:1}.user .muted{max-width:140px}}
main{max-width:1120px;margin:0 auto;padding:24px 16px 96px}
h1{margin:0;font:600 28px/34px var(--font-display)}
h2{margin:0;font:600 20px/26px var(--font-sans)}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}

/* Botones */
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:var(--r-md);border:2px solid transparent;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:focus-visible,.tab:focus-visible,.chipbtn:focus-visible,.card:focus-visible,.x:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--olive)}
.btn-primary{background:var(--olive);color:var(--on-olive)}.btn-primary:hover{background:var(--olive-strong)}
.btn-secondary{background:var(--surface-raised);color:var(--olive-strong);border-color:var(--olive)}.btn-secondary:hover{background:var(--olive-soft)}
.btn-ghost{background:transparent;color:var(--olive-strong)}.btn-ghost:hover{background:var(--olive-soft)}
.btn-danger{background:transparent;color:var(--danger);border-color:var(--danger)}
.btn-sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:var(--r-sm)}
.btn[disabled]{opacity:.5;cursor:wait}

/* Campos */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>label,.lbl{font-weight:600;font-size:14px;line-height:20px}
.inp{display:flex;align-items:center;min-height:48px;background:var(--surface-sunken);border:1.5px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
.inp:focus-within{border-color:var(--olive);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--olive)}
.inp input,.inp select,.inp textarea{flex:1;min-width:0;height:46px;border:0;background:transparent;padding:0 12px;outline:none;font-size:16px;font-variant-numeric:tabular-nums}
.inp textarea{height:auto;min-height:70px;padding:10px 12px;resize:vertical}
.affix{padding:0 10px;color:var(--ink-muted);font-size:14px;font-weight:600;white-space:nowrap}
.inp.warn{border-color:var(--caramel)}
.inp.err{border-color:var(--danger)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:999px;font:600 13px/1 var(--font-sans);white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.c-bizcocho{background:var(--olive-soft);color:var(--olive-strong)}
.c-betun{background:var(--cream);color:#2e2a1f}
.c-relleno{background:var(--caramel-soft);color:var(--caramel-strong)}
.c-topper{background:var(--olive);color:var(--on-olive)}
.c-decoracion{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.c-todas{background:var(--surface-sunken);color:var(--ink)}
.c-todas::before{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{appearance:none;border:0;background:none;padding:2px;border-radius:999px;cursor:pointer}
.chipbtn[aria-pressed="false"] .chip{opacity:.5}
.chipbtn[aria-pressed="true"] .chip{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--olive);opacity:1}

/* Tarjetas */
.panel{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:20px}
.grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{appearance:none;text-align:left;background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px;display:flex;flex-direction:column;gap:12px;cursor:pointer;font:inherit;color:inherit}
.card:hover{border-color:var(--olive)}
.card-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.card h3{margin:0;font:600 19px/25px var(--font-sans)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-sunken);border-radius:var(--r-sm);padding:8px 10px}
.stat b{display:block;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;line-height:16px;color:var(--ink-muted)}
.empty{padding:40px 20px;text-align:center;border:1.5px dashed var(--border-strong);border-radius:var(--r-lg);color:var(--ink-muted)}

/* Avisos */
.note{display:flex;gap:8px;padding:12px 16px;border-radius:var(--r-md);font-size:14px;line-height:20px}
.note b{white-space:nowrap}
.note-ok{background:var(--olive-soft)}.note-ok b{color:var(--olive-strong)}
.note-warn{background:var(--caramel-soft)}.note-warn b{color:var(--caramel-strong)}
.note-err{background:var(--danger-soft)}.note-err b{color:var(--danger)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;width:max-content;box-shadow:var(--shadow-card);max-width:calc(100% - 32px)}

/* Editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
.meta{display:grid;grid-template-columns:2fr 1fr 1.3fr;gap:16px}
.rows-head,.row{display:grid;grid-template-columns:minmax(150px,2fr) 84px 76px 104px 112px 96px 40px;gap:8px;align-items:center}
.rows-head{font:600 12px/16px var(--font-sans);color:var(--ink-muted);padding:0 10px 6px}
.row{padding:8px 10px;border-radius:var(--r-sm)}
.row:nth-child(even){background:var(--surface-sunken)}
.row .inp{min-height:40px;background:var(--surface-raised)}
.row .inp input,.row .inp select{height:38px;padding:0 8px}
.row .affix{padding:0 6px;font-size:13px}
.cost{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cost small{display:block;font-weight:500;font-size:11px;line-height:14px}
.x{appearance:none;width:40px;height:40px;border:0;border-radius:var(--r-sm);background:transparent;color:var(--ink-muted);font-size:20px;cursor:pointer}
.x:hover{background:var(--danger-soft);color:var(--danger)}
.tag-new{font-size:11px;font-weight:700;color:var(--olive-strong);background:var(--olive-soft);border-radius:999px;padding:1px 8px;margin-top:3px;display:inline-block}
.side{position:sticky;top:88px;display:flex;flex-direction:column;gap:12px}
.pieza{margin-top:24px;padding:16px;border-radius:var(--r-md);background:var(--surface-sunken);display:flex;flex-direction:column;gap:14px}
.pieza .inp{background:var(--surface-raised)}
.pieza-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--olive);margin:1px 0 0;flex:0 0 22px}
.check small{display:block;font-weight:400;color:var(--ink-muted);font-size:13px;line-height:18px}
.sug{font-size:12px;line-height:16px;color:var(--ink-muted)}
.precios{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;line-height:18px}
.precios b{font-variant-numeric:tabular-nums}
@media (max-width:860px){.pieza-grid{grid-template-columns:minmax(0,1fr)}}
.card-foto{padding:0;overflow:hidden;gap:0}
.card-foto .card-body{padding:16px;display:flex;flex-direction:column;gap:12px}
.cfoto{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--surface-sunken)}
.ph{display:grid;place-items:center;background:var(--cream);color:var(--olive-strong);font:700 56px/1 var(--font-display)}
.pz-top{display:grid;grid-template-columns:168px minmax(0,1fr);gap:20px;align-items:start}
.foto-box{display:flex;flex-direction:column;gap:6px}
.foto-drop{display:block;width:168px;height:168px;border-radius:var(--r-md);overflow:hidden;cursor:pointer;background:var(--surface-sunken);border:1.5px dashed var(--border-strong)}
.foto-drop:hover{border-color:var(--olive)}
.foto-drop img{width:100%;height:100%;object-fit:cover;display:block}
.foto-ph{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--olive-strong)}
.foto-ph small{color:var(--ink-muted);font-size:12px}
.foto-acc{display:flex;gap:4px}
.foto-acc .btn{flex:1;padding:0 8px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{appearance:none;text-align:left;background:var(--surface-raised);border:1.5px solid var(--border-strong);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-height:64px}
.seg button small{color:var(--ink-muted);font-size:13px;line-height:18px}
.seg button[aria-checked="true"]{background:var(--olive-soft);border:2px solid var(--olive)}
.seg button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--olive)}
.cada{min-height:48px;display:flex;align-items:center;font:700 22px/1 var(--font-display);color:var(--olive-strong);font-variant-numeric:tabular-nums}
.t-short{display:none}
@media (max-width:1360px){.t-long{display:none}.t-short{display:inline}}
@media (max-width:560px){.t-long{display:none}.t-short{display:inline}.tab{padding:8px 10px}
  .pz-top{grid-template-columns:minmax(0,1fr)}.foto-drop{width:100%;height:200px}.seg{grid-template-columns:minmax(0,1fr)}}
.modal-fondo{position:fixed;inset:0;z-index:30;background:rgba(29,30,22,.45);display:flex;align-items:center;justify-content:center;padding:16px}
.modal{width:100%;max-width:520px;max-height:calc(100vh - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px}
.modal h2{font:600 24px/30px var(--font-display)}
.modal-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.modal-acc{display:flex;justify-content:flex-end;gap:8px}
@media (max-width:560px){.modal-grid{grid-template-columns:minmax(0,1fr)}}
/* Cotizador */
.steps{display:flex;gap:4px;list-style:none;margin:0;padding:0 0 4px;overflow-x:auto;scrollbar-width:thin}
.step{appearance:none;border:0;background:transparent;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;font:600 14px/20px var(--font-sans);color:var(--ink-muted);white-space:nowrap;cursor:pointer;min-height:40px}
.step i{font-style:normal;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;box-shadow:inset 0 0 0 1.5px var(--border-strong)}
.step.is-done{color:var(--olive-strong)}.step.is-done i{background:var(--olive-soft);box-shadow:none}
.step.is-current{background:var(--olive);color:var(--on-olive)}.step.is-current i{background:var(--on-olive);color:var(--olive-strong);box-shadow:none}
.step:focus-visible,.opt:focus-visible,.cot-item:focus-visible,.qty button:focus-visible{outline:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--olive)}
.pie-pasos{display:flex;justify-content:space-between;gap:8px;margin-top:16px;flex-wrap:wrap}
.row-title{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.opts,.sug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.opt{position:relative;text-align:left;appearance:none;font:inherit;color:var(--ink);background:var(--surface-raised);border:1.5px solid var(--border-strong);border-radius:var(--r-md);padding:12px 40px 12px 14px;min-height:76px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.opt:hover{border-color:var(--olive)}
.opt-name{font-weight:600}
.opt-cost{font-size:13px;line-height:18px;color:var(--ink-muted);font-variant-numeric:tabular-nums}
.opt-meta{font-size:12px;line-height:16px;color:var(--ink-muted)}
.opt[aria-pressed="true"]{background:var(--olive-soft);border:2px solid var(--olive)}
.opt[aria-pressed="true"] .opt-cost{color:var(--olive-strong);font-weight:600}
.opt[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--olive);color:var(--on-olive);font-size:13px;font-weight:700;display:grid;place-items:center}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--border-strong);border-radius:var(--r-md);background:var(--surface-raised);overflow:hidden;flex:0 0 auto}
.qty button{appearance:none;width:44px;height:44px;border:0;background:transparent;color:var(--olive-strong);font:600 22px/1 var(--font-sans);cursor:pointer}
.qty button:hover{background:var(--olive-soft)}
.qty output{min-width:36px;text-align:center;font:600 17px/1 var(--font-sans);font-variant-numeric:tabular-nums}
.pisos{display:flex;flex-direction:column;gap:8px}
.piso{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:var(--r-md);background:var(--surface-sunken)}
.piso .inp{background:var(--surface-raised)}
.piso-n{font-weight:600;min-width:96px}
.piezas-sel{display:flex;flex-direction:column;gap:10px}
.pz-sel{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:var(--r-md);border:1.5px solid var(--border);background:var(--surface-raised)}
.pz-sel.on{border:2px solid var(--olive);background:var(--olive-soft)}
.pz-foto{width:64px;height:64px;border-radius:var(--r-sm);object-fit:cover;display:block}
.pz-foto.ph{font-size:28px}
.pz-info{display:flex;flex-direction:column;gap:4px;min-width:0}
.seg-sm{grid-template-columns:auto auto;justify-content:start;gap:6px}
.seg-sm button{min-height:34px;padding:4px 12px;font-size:13px;font-weight:600}
.msg{white-space:pre-wrap;font:400 14px/21px var(--font-sans);background:var(--surface-sunken);border-radius:var(--r-md);padding:14px 16px;margin:0}
.sum{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);overflow:hidden}
.sum-head{padding:16px;border-bottom:1px solid var(--border)}
.sum-head h3{margin:0;font:600 22px/28px var(--font-display)}
.lns{list-style:none;margin:0;padding:4px 16px}
.ln{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border)}
.ln:last-child{border-bottom:0}
.ln-what{display:flex;flex-direction:column;gap:3px;min-width:0}
.ln-what .chip{align-self:flex-start}
.ln-what small{display:block;font-size:12px;line-height:16px;color:var(--ink-muted)}
.sum-sub,.sum-dep,.sum-foot{display:flex;justify-content:space-between;padding:10px 16px;background:var(--surface-sunken)}
.sum-margin{display:flex;justify-content:space-between;padding:10px 16px;background:var(--caramel-soft);color:var(--caramel-strong);font-weight:600}
.sum-total{padding:14px 16px}
.sum-total small{display:block;font-size:13px;color:var(--ink-muted)}
.price{font:700 34px/38px var(--font-display);color:var(--olive-strong);font-variant-numeric:tabular-nums}
.sum-dep{background:var(--olive-soft)}
.sum-foot{font-size:13px;color:var(--ink-muted);border-top:1px solid var(--border)}
.cot-list{display:flex;flex-direction:column;gap:10px}
.cot-item{appearance:none;font:inherit;color:inherit;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-raised);border:1px solid var(--border);box-shadow:var(--shadow-card);cursor:pointer}
.cot-item:hover{border-color:var(--olive)}
.cot-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.cot-side{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.est-borrador{background:var(--surface-sunken);color:var(--ink)}
.est-enviada{background:var(--caramel-soft);color:var(--caramel-strong)}
.est-aceptada{background:var(--olive);color:var(--on-olive)}
.est-rechazada,.est-vencida{background:var(--danger-soft);color:var(--danger)}
.molde-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto minmax(0,1fr) auto 40px;gap:8px;align-items:center}
.molde-row .inp{min-height:40px}.molde-row .inp input{height:38px}
.refbox{display:flex;flex-direction:column;gap:6px;margin-bottom:24px;padding:14px 16px;border-radius:var(--r-md);background:var(--surface-sunken)}
.ref-frase{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:600}
.ref-n{width:96px;background:var(--surface-raised);min-height:40px}.ref-n input{height:38px}
.det{width:100%;border-collapse:collapse;font-size:14px}.det th{font:600 12px/16px var(--font-sans);color:var(--ink-muted);text-align:left;padding:0 6px 6px}.det td{padding:7px 6px;border-top:1px solid var(--border);vertical-align:top}.det td:nth-child(2){white-space:nowrap}
.pz-foto.ph{display:grid}
.res-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.subnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.subtab{appearance:none;border:1.5px solid var(--border-strong);background:var(--surface-raised);color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px/20px var(--font-sans);cursor:pointer}
.subtab[aria-current="true"]{background:var(--olive-soft);border-color:var(--olive);color:var(--olive-strong)}
.ped{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:var(--surface-raised);border:1px solid var(--border);box-shadow:var(--shadow-card)}
.ped-fecha{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--olive-soft);color:var(--olive-strong);border-radius:var(--r-sm);padding:8px 4px;text-align:center}
.ped-fecha b{font:700 17px/20px var(--font-display)}.ped-fecha span{font-size:12px}
.ped-fecha.tarde{background:var(--danger-soft);color:var(--danger)}
.ped-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.ped-acc{display:flex;flex-direction:column;gap:6px;align-items:stretch;min-width:190px}
.ped-acc .inp{min-height:40px}.ped-acc select{height:38px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal-dia{background:var(--surface-raised);border:1px solid var(--border);border-radius:var(--r-md);padding:10px;display:flex;flex-direction:column;gap:6px;min-height:140px}
.cal-dia h3{margin:0 0 2px;font:600 13px/18px var(--font-sans);color:var(--ink-muted)}
.cal-dia h3::first-letter{text-transform:uppercase}
.cal-dia.hoy{border:2px solid var(--olive)}.cal-dia.hoy h3{color:var(--olive-strong)}
.tarea{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;padding:6px 8px;border-radius:var(--r-sm);background:var(--surface-sunken);cursor:pointer}
.tarea input{width:18px;height:18px;accent-color:var(--olive);margin:0;flex:0 0 18px}
.tarea small{display:block;color:var(--ink-muted);font-size:12px;line-height:16px}
.tarea.et-horneado{background:var(--olive-soft)}.tarea.et-preparacion{background:var(--caramel-soft)}.tarea.et-entrega{box-shadow:inset 3px 0 0 var(--olive)}
.tarea.hecha{opacity:.55}.tarea.hecha b{text-decoration:line-through}
@media (max-width:1100px){.cal{grid-template-columns:minmax(0,1fr)}.cal-dia{min-height:0}}
@media (max-width:700px){.ped{grid-template-columns:60px minmax(0,1fr)}.ped-acc{grid-column:1/-1;min-width:0}.res-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.login-links{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}.login-links a{color:var(--olive-strong);font-weight:600}
.aviso-cot{margin-bottom:16px}.aviso-cot a{color:var(--caramel-strong);font-weight:700}
.ins-nombre{appearance:none;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.ins-edit{font-size:12px;font-weight:600;color:var(--olive-strong);text-decoration:underline;margin-left:4px}
.ins-meta{display:block;font-size:12px;line-height:16px;color:var(--ink-muted);margin:2px 0 4px}
.cfg{display:flex;flex-direction:column;gap:16px;max-width:860px}
.cfg h2{margin-bottom:14px}
.cfg-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cfg-moldes{display:flex;flex-wrap:wrap;gap:8px}
@media (max-width:560px){.cfg-grid{grid-template-columns:minmax(0,1fr)}}
.meta.meta-cli{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:560px){.meta.meta-cli{grid-template-columns:minmax(0,1fr)}}
.barra-precio{display:none}
@media (max-width:860px){
  .barra-precio{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:15;justify-content:space-between;align-items:center;gap:8px;appearance:none;border:0;cursor:pointer;
    background:var(--olive);color:var(--on-olive);border-radius:var(--r-md);padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18);font:600 13px/18px var(--font-sans)}
  .barra-precio b{font:700 22px/1 var(--font-display)}
  .pie-pasos>span{display:none}.pie-pasos .btn{flex:1 1 auto}
}
@media (max-width:860px){.pz-sel{grid-template-columns:52px minmax(0,1fr)}.pz-sel .qty,.pz-sel>.btn{grid-column:2;justify-self:start}.pz-foto{width:52px;height:52px}}
@media (max-width:560px){.tabs{overflow-x:auto;justify-content:flex-start}.tab{flex:0 0 auto}.cot-item{flex-direction:column;align-items:flex-start}.cot-side{flex-direction:row;align-items:center}
  .molde-row{grid-template-columns:70px minmax(0,1fr) auto minmax(0,1fr) 40px}.molde-row>.small{display:none}}
.big{font:700 34px/38px var(--font-display);color:var(--olive-strong);font-variant-numeric:tabular-nums}

/* Insumos */
.tbl{width:100%;border-collapse:collapse}
.tbl th{font:600 12px/16px var(--font-sans);color:var(--ink-muted);text-align:left;padding:0 8px 8px}
.tbl td{padding:8px;border-top:1px solid var(--border);vertical-align:middle}
.tbl .inp{min-height:40px;background:var(--surface-raised)}
.tbl .inp input{height:38px;padding:0 8px}
.pill{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px}
.pill-warn{background:var(--caramel-soft);color:var(--caramel-strong)}
.pill-ok{background:var(--olive-soft);color:var(--olive-strong)}

/* Login */
.login{max-width:400px;margin:8vh auto 0}
.login .brandbig{font:700 40px/44px var(--font-display);color:var(--olive-strong);margin:0 0 6px}

@media (max-width:860px){
  .ed{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .meta{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .meta .f-nombre{grid-column:1/-1}
  .rows-head{display:none}
  .row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);grid-template-areas:"n n x" "c u k" "p q t";padding:12px 10px}
  .row>:nth-child(1){grid-area:n}.row>:nth-child(2){grid-area:c}.row>:nth-child(3){grid-area:u}
  .row>:nth-child(4){grid-area:p}.row>:nth-child(5){grid-area:q}.row>:nth-child(6){grid-area:t;align-self:center}
  .row>:nth-child(7){grid-area:x;justify-self:end}
  .row .mlabel,.tbl .mlabel{display:block}
  .tbl,.tbl tbody{display:block}
  .tbl thead{display:none}
  .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:12px 0;border-top:1px solid var(--border)}
  .tbl td{border:0;padding:0}
  .tbl td.t-name{grid-column:1/-1}
}
.mlabel{display:none;font-size:11px;font-weight:600;color:var(--ink-muted);line-height:14px;margin-bottom:2px}

<script>
/* ===== Configuración ===== */
const SUPABASE_URL = 'https://niwrligrgmsjpupcukck.supabase.co';
const SUPABASE_KEY = 'sb_publishable_BjkHFGNoGNxXcaCmTCHIXA_RKvkbHdv'; // llave pública; la seguridad la dan las reglas RLS
const DEMO = new URLSearchParams(location.search).has('demo');

const TIPOS = [
  { id:'bizcocho', label:'Bizcocho' }, { id:'relleno', label:'Relleno' }, { id:'betun', label:'Betún' },
  { id:'topper', label:'Topper' }, { id:'decoracion', label:'Decoración' }
];
const UNIDADES_BASE = ['g','kg','ml','l','pz'];
const UNIDAD_BASE_INFO = { g:[1,'g'], kg:[1000,'g'], ml:[1,'ml'], l:[1000,'ml'], lt:[1000,'ml'], pz:[1,'pz'] };
function opcionesUnidad(sel) {
  const lista = [...UNIDADES_BASE, ...S.unidades.map(u => u.clave)];
  if (sel && !lista.includes(sel)) lista.push(sel);
  return lista.map(u => `<option value="${esc(u)}" ${u === sel ? 'selected' : ''}>${esc(u)}</option>`).join('')
    + '<option disabled>──────</option><option value="__nueva">+ Nueva unidad…</option>';
}
const TIPOS_RECETA = TIPOS.slice(0, 3), TIPOS_PIEZA = TIPOS.slice(3);
const ES_PIEZA = t => t === 'topper' || t === 'decoracion';
let CFG = { pct_renta: 25, pct_deposito: 100, pct_venta_pieza: 20, dias_devolucion: 3, redondeo: 10 };
function sugeridos(costo) {
  const red = Number(CFG.redondeo) || 10;
  return {
    renta: costo ? Math.max(red, Math.round(costo * CFG.pct_renta / 100 / red) * red) : 0,
    deposito: Math.ceil(+(costo * CFG.pct_deposito / 100 / red).toFixed(6)) * red,
    venta: Math.ceil(+(costo * (1 + CFG.pct_venta_pieza / 100) / red).toFixed(6)) * red
  };
}
const tipoLabel = id => (TIPOS.find(t => t.id === id) || { label:id }).label;

/* ===== Utilidades ===== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const money = n => n == null || isNaN(n) ? '—' : '$' + Number(n).toLocaleString('es-MX', { minimumFractionDigits:2, maximumFractionDigits:2 });
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const norm = s => String(s || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
function baseUnidad(u) {
  const k = String(u || '').trim().toLowerCase();
  if (UNIDAD_BASE_INFO[k]) return UNIDAD_BASE_INFO[k];
  const x = S.unidades.find(z => z.clave === k);
  return x && x.unidad_base ? [Number(x.equivale), x.unidad_base] : [1, '~' + k];
}
function convertir(c, de, a) {
  if (String(de || '').trim().toLowerCase() === String(a || '').trim().toLowerCase()) return c;
  const A = baseUnidad(de), B = baseUnidad(a);
  return A[1] === B[1] ? c * A[0] / B[0] : null;
}
let toastTimer;
function toast(kind, title, msg) {
  const t = $('#toast');
  t.className = `toast note note-${kind}`;
  t.innerHTML = `<b>${esc(title)}</b><span>${esc(msg || '')}</span>`;
  t.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.hidden = true, kind === 'err' ? 7000 : 3500);
}

/* ===== Capa de datos: Supabase real ===== */
function supabaseApi() {
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  const ok = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    async session() { const { data } = await sb.auth.getSession(); return data.session?.user || null; },
    async signIn(email, password) { const { data, error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw new Error(traducirAuth(error.message)); return data.user; },
    async signOut() { await sb.auth.signOut(); },
    async signUp(email, password, nombre) {
      const { data, error } = await sb.auth.signUp({ email, password, options: { data: { nombre }, emailRedirectTo: location.href.split('#')[0].split('?')[0] } });
      if (error) throw new Error(traducirAuth(error.message));
      return { user: data.session ? data.user : null, confirmar: !data.session };
    },
    async recuperar(email) { const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split('#')[0].split('?')[0] }); if (error) throw new Error(traducirAuth(error.message)); },
    async cambiarPassword(password) { const { error } = await sb.auth.updateUser({ password }); if (error) throw new Error(traducirAuth(error.message)); },
    alRecuperar(cb) { sb.auth.onAuthStateChange(ev => { if (ev === 'PASSWORD_RECOVERY') cb(); }); },
    async recetas() { return ok(await sb.from('v_costo_recetas').select('*').order('tipo').order('nombre')); },
    async receta(id) {
      const r = ok(await sb.from('recetas').select('*').eq('id', id).single());
      const lineas = ok(await sb.from('receta_ingredientes').select('id, ingrediente_id, cantidad, unidad, notas').eq('receta_id', id).order('creado_en'));
      return { ...r, lineas };
    },
    async ingredientes() { return ok(await sb.from('ingredientes').select('*').neq('estado', 'inactivo').order('nombre')); },
    async config() { return ok(await sb.from('configuracion').select('*').maybeSingle()); },
    async unidades() { return ok(await sb.from('unidades').select('*').order('clave')); },
    async crearUnidad(u) { return ok(await sb.from('unidades').insert(u).select().single()); },
    async crearIngrediente(i) { return ok(await sb.from('ingredientes').insert(i).select().single()); },
    async actualizarInsumo(id, datos) { return ok(await sb.from('ingredientes').update(datos).eq('id', id).select().single()); },
    async guardarConfig(datos) {
      const { data: { user } } = await sb.auth.getUser();
      return ok(await sb.from('configuracion').upsert({ usuario_id: user.id, ...datos, actualizado_en: new Date().toISOString() }, { onConflict: 'usuario_id' }).select().single());
    },
    async actualizarPrecio(id, precio, presentacion, unidad) {
      const r = ok(await sb.from('ingredientes').update({ precio_actual: precio, cantidad_presentacion: presentacion, unidad, estado: 'activo' }).eq('id', id).select().single());
      ok(await sb.from('historial_precios').insert({ ingrediente_id: id, cantidad: presentacion, unidad, precio_total: precio, precio_unitario: presentacion ? +(precio / presentacion).toFixed(6) : null, notas: 'Capturado en Recetario' }));
      return r;
    },
    async guardarReceta(rec, lineas, quitar) {
      const datos = { nombre: rec.nombre, tipo: rec.tipo, porciones_base: rec.porciones_base, rendimiento_cantidad: rec.rendimiento_cantidad, rendimiento_unidad: rec.rendimiento_unidad, descripcion: rec.descripcion,
        se_renta: rec.se_renta, precio_renta: rec.precio_renta, deposito: rec.deposito, precio_venta: rec.precio_venta, forma_obtencion: rec.forma_obtencion,
        ref_diametro_cm: rec.ref_diametro_cm ?? null, ref_panes: rec.ref_panes ?? null };
      const r = rec.id ? ok(await sb.from('recetas').update(datos).eq('id', rec.id).select().single())
                       : ok(await sb.from('recetas').insert(datos).select().single());
      const filas = lineas.map(l => ({ ...(l.id ? { id: l.id } : {}), receta_id: r.id, nombre_receta: r.nombre, ingrediente_id: l.ingrediente_id, cantidad: l.cantidad, unidad: l.unidad }));
      const existentes = filas.filter(f => f.id), nuevas = filas.filter(f => !f.id);
      if (existentes.length) ok(await sb.from('receta_ingredientes').upsert(existentes));
      if (nuevas.length) ok(await sb.from('receta_ingredientes').insert(nuevas));
      if (quitar.length) ok(await sb.from('receta_ingredientes').delete().in('id', quitar));
      return r;
    },
    async borrarReceta(id) { ok(await sb.from('recetas').delete().eq('id', id)); },
    async subirFoto(recetaId, blob) {
      const { data: { user } } = await sb.auth.getUser();
      const path = `${user.id}/${recetaId}-${Date.now()}.jpg`;
      ok(await sb.storage.from('fotos-piezas').upload(path, blob, { contentType: 'image/jpeg', upsert: true }));
      return path;
    },
    async setFoto(recetaId, path) { ok(await sb.from('recetas').update({ foto_path: path }).eq('id', recetaId)); },
    async borrarFoto(path) { ok(await sb.storage.from('fotos-piezas').remove([path])); },
    async fotoUrls(paths) {
      const data = ok(await sb.storage.from('fotos-piezas').createSignedUrls(paths, 60 * 60 * 6));
      return Object.fromEntries(data.filter(d => d.signedUrl).map(d => [d.path, d.signedUrl]));
    },
    async clientes() { return ok(await sb.from('clientes').select('*').order('nombre')); },
    async crearCliente(c) { return ok(await sb.from('clientes').insert(c).select().single()); },
    async actualizarCliente(id, c) { return ok(await sb.from('clientes').update(c).eq('id', id).select().single()); },
    async borrarCliente(id) { ok(await sb.from('clientes').delete().eq('id', id)); },
    async pedidos() { return ok(await sb.from('pedidos').select('*, clientes(nombre)').order('fecha_entrega')); },
    async crearPedido(p) { return ok(await sb.from('pedidos').insert(p).select().single()); },
    async actualizarPedido(id, d) { return ok(await sb.from('pedidos').update(d).eq('id', id).select().single()); },
    async tareas(desde, hasta) { return ok(await sb.from('plan_produccion').select('*, pedidos(id, producto, estado, hora_entrega, cotizacion_id, clientes(nombre))').gte('fecha_programada', desde).lte('fecha_programada', hasta).order('fecha_programada')); },
    async estadoTarea(id, estado) { ok(await sb.from('plan_produccion').update({ estado }).eq('id', id)); },
    async detalleDe(cotIds) { return ok(await sb.from('cotizacion_detalle').select('*').in('cotizacion_id', cotIds)); },
    async lineasDe(recIds) { return ok(await sb.from('receta_ingredientes').select('receta_id, ingrediente_id, cantidad, unidad').in('receta_id', recIds)); },
    async moldes() { return ok(await sb.from('tamanos_molde').select('*').order('diametro_cm')); },
    async guardarMolde(m) { return m.id ? ok(await sb.from('tamanos_molde').update({ porciones_min: m.porciones_min, porciones_max: m.porciones_max }).eq('id', m.id).select().single())
                                        : ok(await sb.from('tamanos_molde').insert(m).select().single()); },
    async borrarMolde(id) { ok(await sb.from('tamanos_molde').delete().eq('id', id)); },
    async cotizaciones() { return ok(await sb.from('cotizaciones').select('id, folio, producto, porciones, precio_cotizado, estado, fecha_cotizacion, creado_en, cliente_id, clientes(nombre)').order('creado_en', { ascending: false })); },
    async cotizacion(id) {
      const c = ok(await sb.from('cotizaciones').select('*').eq('id', id).single());
      c.detalle = ok(await sb.from('cotizacion_detalle').select('*').eq('cotizacion_id', id).order('creado_en'));
      return c;
    },
    async guardarCotizacion(cot, lineas) {
      const { id, ...datos } = cot;
      const c = id ? ok(await sb.from('cotizaciones').update(datos).eq('id', id).select().single())
                   : ok(await sb.from('cotizaciones').insert(datos).select().single());
      try {
        if (id) ok(await sb.from('cotizacion_detalle').delete().eq('cotizacion_id', c.id));
        if (lineas.length) ok(await sb.from('cotizacion_detalle').insert(lineas.map(l => ({ deposito: 0, ...l, cotizacion_id: c.id })), { defaultToNull: false }));
      } catch (x) {
        if (!id) await sb.from('cotizaciones').delete().eq('id', c.id);   // no dejar una cotización a medias
        throw x;
      }
      return c;
    },
    async estadoCotizacion(id, estado) { ok(await sb.from('cotizaciones').update({ estado }).eq('id', id)); },
    async borrarCotizacion(id) { ok(await sb.from('cotizaciones').delete().eq('id', id)); },
    async empaques() { return ok(await sb.from('empaques').select('*').order('nombre')); },
    async guardarEmpaque(e) { const { id, ...d } = e; return id ? ok(await sb.from('empaques').update(d).eq('id', id).select().single()) : ok(await sb.from('empaques').insert(d).select().single()); },
    async borrarEmpaque(id) { ok(await sb.from('empaques').delete().eq('id', id)); }
  };
}

/* ===== Capa de datos: modo demostración (?demo) ===== */
function demoApi() {

  ing.forEach(i => { if (!i.precio_actual) i.precio_actual = { 'Azúcar Estandar': 15, Mantequilla: 250, Huevo: 5, 'Aceite Cristal': 80 }[i.nombre] || i.precio_actual; });
  const R = (o) => ({ rendimiento_cantidad:null, rendimiento_unidad:null, descripcion:'', se_renta:false, precio_renta:null, deposito:null, precio_venta:null, foto_path:null, forma_obtencion:null, ref_diametro_cm:null, ref_panes:null, estado:'activo', ...o });
  const recs = [R({ id: 'demo-r1', nombre:'Bizcocho de Vainilla', tipo:'bizcocho', porciones_base:10, ref_diametro_cm:20, ref_panes:2 }),
    R({ id: 'demo-r2', nombre:'Relleno de queso crema', tipo:'relleno', porciones_base:20 }),
    R({ id: 'demo-r3', nombre:'Betún de mantequilla', tipo:'betun', porciones_base:20, ref_diametro_cm:20, ref_panes:2 }),
    R({ id: 'demo-r4', nombre:'Base acrílico 20 cm', tipo:'topper', porciones_base:1, se_renta:true, forma_obtencion:'comprada' }),
    R({ id: 'demo-r5', nombre:'Flores naturales', tipo:'decoracion', porciones_base:1, forma_obtencion:'comprada' })];
  const clis = [{ id:'demo-c1', nombre:'Fabiola Piña', telefono:'3121234567' }, { id:'demo-c2', nombre:'Brianda Del Toro', telefono:null }];

/* ===== Login ===== */
function traducirAuth(m) {
  const t = [[/invalid login credentials/i, 'Correo o contraseña incorrectos.'], [/already registered|already exists/i, 'Ese correo ya tiene una cuenta. Entra o recupera tu contraseña.'],
    [/at least (\d+)/i, 'La contraseña debe tener al menos 6 caracteres.'], [/signups? not allowed|signup is disabled/i, 'El registro de usuarios nuevos está desactivado en Supabase.'],
    [/email not confirmed/i, 'Falta confirmar tu correo: abre el enlace que te llegó.'], [/for security purposes|rate limit/i, 'Espera un minuto antes de volver a intentarlo.'],
    [/same password|different from the old/i, 'La nueva contraseña debe ser distinta a la anterior.'], [/invalid.*email|unable to validate email/i, 'Revisa el correo; no parece válido.']];
  const x = t.find(([r]) => r.test(m)); return x ? x[1] : m;
}

  }
  let t = 0, sin = 0, inc = 0, n = 0;
  e.filas.forEach(f => { const c = costoFila(f); if (!f.nombre.trim()) return; n++; if (c.err) inc++; if (c.warn) sin++; if (c.v) t += c.v; });

function validarFilas(filas, que, errores) {

async function lineasDesdeFilas(filas) {
  for (const f of filas) {
    const precio = num(f.precio) || 0, pres = num(f.pres);

      f.ing = await api.crearIngrediente({ nombre: f.nombre.trim(), unidad: f.presU || f.unidad, precio_actual: precio, cantidad_presentacion: pres || null, tipo: 'Ingrediente', estado: 'activo' });
      S.ingredientes.push(f.ing);
    } else if (precio !== Number(f.ing.precio_actual || 0) || (pres || null) !== (f.ing.cantidad_presentacion == null ? null : Number(f.ing.cantidad_presentacion))) {
      f.ing = await api.actualizarPrecio(f.ing.id, precio, pres || null, f.ing.unidad);   // precio capturado o cambiado
    }
  }
  return filas.map(f => ({ id: f.id, ingrediente_id: f.ing.id, cantidad: num(f.cantidad), unidad: f.unidad }));

async function guardar() {
  const e = S.ed, pieza = e.kind === 'pieza', errores = [];
  if (!e.nombre.trim()) { errores.push(`Escribe el nombre de la ${pieza ? 'pieza' : 'receta'}.`); $('#iNombre').classList.add('err'); }
  const porc = pieza ? 1 : parseInt(e.porciones_base, 10);
  if (!pieza && (!porc || porc <= 0)) { errores.push('Indica cuántas porciones rinde.'); $('#iPorc').classList.add('err'); }
  const filas = e.filas.filter(f => f.nombre.trim());
  if (pieza && e.forma === 'comprada') {
    if (!(num(e.compra.precio) > 0)) { errores.push('Escribe cuánto pagaste.'); $('#iCPrecio').classList.add('err'); }
    if (!(num(e.compra.piezas) > 0)) { errores.push('Indica cuántas piezas traía.'); $('#iCPiezas').classList.add('err'); }
  } else validarFilas(filas, pieza ? 'material' : 'ingrediente', errores);
  if (errores.length) { toast('err', 'Falta un dato.', errores[0]); return; }

  const btn = $('#btnGuardar'), txt = btn.textContent; btn.disabled = true; btn.textContent = 'Guardando…';
  try {

        ing = await api.crearIngrediente({ nombre: e.nombre.trim(), unidad: 'pz', precio_actual: precio, cantidad_presentacion: piezas, tipo: e.tipo === 'topper' ? 'Topper' : 'Decoracion', estado: 'activo' });
        S.ingredientes.push(ing);
      } else if (precio !== Number(ing.precio_actual || 0) || piezas !== Number(ing.cantidad_presentacion || 0) || ing.unidad !== 'pz') {
        ing = await api.actualizarPrecio(ing.id, precio, piezas, ing.unidad);
      }
      e.compra.ing = ing;
      lineas = [{ id: e.compra.lineaId, ingrediente_id: ing.id, cantidad: 1, unidad: ing.unidad === 'pz' ? 'pz' : ing.unidad }];
    } else {
      lineas = await lineasDesdeFilas(filas);
    }
    const quitar = e.originales.filter(id => !lineas.some(l => l.id === id));
    const r = await api.guardarReceta({ id: e.id, nombre: e.nombre.trim(), tipo: e.tipo, porciones_base: porc,
      rendimiento_cantidad: pieza ? null : num(e.rendimiento_cantidad) || null, rendimiento_unidad: !pieza && num(e.rendimiento_cantidad) ? e.rendimiento_unidad : null,
      descripcion: e.descripcion.trim() || null, forma_obtencion: pieza ? e.forma : null,
      ref_diametro_cm: !pieza && num(e.ref_diametro_cm) > 0 && num(e.ref_panes) > 0 ? num(e.ref_diametro_cm) : null, ref_panes: !pieza && num(e.ref_diametro_cm) > 0 && num(e.ref_panes) > 0 ? num(e.ref_panes) : null,
      se_renta: pieza && !!e.se_renta, precio_renta: pieza && e.se_renta && num(e.precio_renta) != null ? num(e.precio_renta) : null,
      deposito: pieza && e.se_renta && num(e.deposito) != null ? num(e.deposito) : null, precio_venta: pieza ? num(e.precio_venta) : null }, lineas, quitar);
    // Foto: subir la nueva y/o quitar la anterior
    let fotoError = null;
    try {
      if (e.fotoBlob) {
        const path = await api.subirFoto(r.id, e.fotoBlob);
        await api.setFoto(r.id, path);
        S.fotos[path] = e.fotoPreview;
        if (e.foto_path && e.foto_path !== path) await api.borrarFoto(e.foto_path).catch(() => {});
      } else if (e.quitarFoto && e.foto_path) {
        await api.setFoto(r.id, null);
        await api.borrarFoto(e.foto_path).catch(() => {});
      }
    } catch (x) { fotoError = x.message; }
    if (fotoError) toast('warn', `${pieza ? 'Pieza guardada' : 'Receta guardada'}, sin foto.`, `No se pudo subir la foto: ${fotoError}`);
    else toast('ok', pieza ? 'Pieza guardada.' : 'Receta guardada.', `${r.nombre} ya aparece en ${pieza ? 'toppers y decoración' : 'tus recetas'}.`);
    if (pieza) S.filtroP = 'todas'; else S.filtroR = 'todas';

function abrirModal(titulo, cuerpo, textoOk) {
  return new Promise(resolve => {
    const fondo = document.createElement('div');
    fondo.className = 'modal-fondo';
    fondo.innerHTML = `<form class="modal panel" role="dialog" aria-modal="true" aria-label="${esc(titulo)}">
      <h2>${esc(titulo)}</h2>${cuerpo}
      <div class="modal-err" hidden></div>
      <div class="modal-acc"><button type="button" class="btn btn-ghost" data-cancel>Cancelar</button><button type="submit" class="btn btn-primary">${esc(textoOk)}</button></div>
    </form>`;
    document.body.appendChild(fondo);
    const form = fondo.querySelector('form');
    const cerrar = v => { fondo.remove(); document.removeEventListener('keydown', esc_); resolve(v); };
    const esc_ = ev => { if (ev.key === 'Escape') cerrar(null); };
    document.addEventListener('keydown', esc_);
    fondo.addEventListener('mousedown', ev => { if (ev.target === fondo) cerrar(null); });
    form.querySelector('[data-cancel]').onclick = () => cerrar(null);
    form.error = msg => { const e = form.querySelector('.modal-err'); e.hidden = !msg; e.innerHTML = msg ? `<div class="note note-err"><b>Falta un dato.</b><span>${esc(msg)}</span></div>` : ''; };
    form.cerrar = cerrar;
    const primero = form.querySelector('input'); if (primero) primero.focus();
    abrirModal.ultimo = form;
  });
}

function unitario(p, q, u) {

  return `${money(v)} <span class="muted small">por ${esc(u)}</span>`;

/* ===== Cotizador: cálculos ===== */
const ALTO_PAN_CM = 3;   // alto aproximado de un pan, para estimar el betún de los lados
const PASOS = ['Tamaño', 'Bizcocho', 'Relleno', 'Betún', 'Toppers', 'Decoración', 'Empaque', 'Resumen'];
const ceilRed = v => { const r = Number(CFG.redondeo) || 10; return Math.ceil(+(v / r).toFixed(6)) * r; };
const fmtN = (v, d = 1) => Number(v).toLocaleString('es-MX', { maximumFractionDigits: d });
function porcionesMolde(d) {
  d = Number(d);
  const t = S.moldes.find(m => Number(m.diametro_cm) === d);
  if (t) return [Number(t.porciones_min), Number(t.porciones_max)];
  if (!S.moldes.length) return [Math.round(d * d / 40), Math.round(d * d / 20)];
  const ref = S.moldes.reduce((a, m) => !a || Math.abs(m.diametro_cm - d) < Math.abs(a.diametro_cm - d) ? m : a, null);
  const k = (d / ref.diametro_cm) ** 2;
  return [Math.max(1, Math.round(ref.porciones_min * k)), Math.max(1, Math.round(ref.porciones_max * k))];
}
function porcionesEstructura(pisos) {
  return pisos.reduce((a, p) => { const [mn, mx] = porcionesMolde(p.d); return [a[0] + mn * p.panes / 2, a[1] + mx * p.panes / 2]; }, [0, 0]).map(Math.round);
}
function descEstructura(pisos) {
  return pisos.map((p, i) => `${pisos.length > 1 ? `Piso ${i + 1}: ` : ''}${fmtN(p.d)} cm · ${p.panes} pan${p.panes == 1 ? '' : 'es'}${p.panes >= 4 ? ' (doble altura)' : ''}`).join(' · ');
}
function superficieBetun(d, panes) { return d * d / 4 + d * panes * ALTO_PAN_CM; }
// Cuántas tandas de la receta lleva este pastel. Devuelve { tandas, exacto }
function tandasReceta(r, pisos) {
  const ref = Number(r.ref_diametro_cm) > 0 && Number(r.ref_panes) > 0;
  const [mn, mx] = porcionesEstructura(pisos), porc = (mn + mx) / 2;
  const porPorciones = { tandas: porc / (Number(r.porciones_base) || 1), exacto: false };
  if (!ref) return r.tipo === 'relleno' && !pisos.some(p => p.panes > 1) ? { tandas: 0, exacto: false } : porPorciones;
  const rd = Number(r.ref_diametro_cm), rp = Number(r.ref_panes);
  if (r.tipo === 'bizcocho') return { tandas: pisos.reduce((a, p) => a + p.panes * p.d * p.d, 0) / (rp * rd * rd), exacto: true };
  if (r.tipo === 'relleno') return { tandas: pisos.reduce((a, p) => a + Math.max(p.panes - 1, 0) * p.d * p.d, 0) / (rp * rd * rd), exacto: true };
  if (r.tipo === 'betun') return { tandas: pisos.reduce((a, p) => a + superficieBetun(p.d, p.panes), 0) / superficieBetun(rd, rp), exacto: true };
  return porPorciones;
}
function sugerenciasTamano(P) {
  P = Number(P); if (!(P > 0)) return [];
  const moldes = [...S.moldes].sort((a, b) => a.diametro_cm - b.diametro_cm), out = [];
  const cabe = pisos => { const [mn, mx] = porcionesEstructura(pisos); return P >= mn && P <= mx; };
  moldes.forEach(m => { const p = [{ d: Number(m.diametro_cm), panes: 2 }]; if (cabe(p)) out.push({ pisos: p, nota: 'Altura normal' }); });
  moldes.forEach(m => { const p = [{ d: Number(m.diametro_cm), panes: 4 }]; if (cabe(p)) out.push({ pisos: p, nota: 'Doble altura (más alto y angosto)' }); });
  moldes.forEach((a, i) => moldes.slice(i + 1).forEach(b => { const p = [{ d: Number(b.diametro_cm), panes: 2 }, { d: Number(a.diametro_cm), panes: 2 }]; if (cabe(p)) out.push({ pisos: p, nota: 'Dos pisos' }); }));
  if (!out.length && moldes.length) {
    const m = moldes.find(m => porcionesMolde(m.diametro_cm)[1] >= P) || moldes[moldes.length - 1];
    out.push({ pisos: [{ d: Number(m.diametro_cm), panes: 2 }], nota: 'Lo más cercano' });
  }
  return out.slice(0, 4);
}
function sumaEmpaques(Q) {
  return Object.entries(Q.empaques || {}).reduce((a, [id, q]) => { const e = S.empaques.find(x => x.id === id); return a + (e ? Number(e.precio) * q : 0); }, 0);
}
function calcCotizacion(Q) {
  const byId = id => S.recetas.find(r => r.receta_id === id);
  const lineas = [];
  ['bizcocho', 'relleno', 'betun'].forEach(t => {
    const r = Q[t] && byId(Q[t]); if (!r) return;
    const { tandas, exacto } = tandasReceta(r, Q.pisos);
    lineas.push({ tipo: t, r, tandas, exacto, costo: tandas * Number(r.costo_tanda) });
  });
  const piezas = Object.entries(Q.piezas).map(([id, p]) => {
    const r = byId(id); if (!r || !(p.qty > 0)) return null;
    const renta = p.modalidad === 'renta' && r.se_renta;
    const precioU = Number(renta ? r.precio_renta : r.precio_venta) || 0;
    return { r, qty: p.qty, modalidad: renta ? 'renta' : 'venta', precioU, precio: precioU * p.qty,
      costo: renta ? 0 : Number(r.costo_tanda) * p.qty, deposito: renta ? (Number(r.deposito) || 0) * p.qty : 0 };
  }).filter(Boolean);
  const ingredientes = lineas.reduce((a, l) => a + l.costo, 0);
  const indirectos = ingredientes * (Number(Q.pctIndirectos) || 0) / 100;
  const manoObra = (num(Q.horas) || 0) * (Number(CFG.tarifa_mano_obra_hora) || 0);
  const empaque = num(Q.empaque) || 0, otros = num(Q.otros) || 0, merma = num(Q.merma) || 0;
  const base = ingredientes + indirectos + manoObra + empaque + otros + merma;
  const m = Math.min(Math.max(num(Q.margen) ?? 40, 0), 90);
  const precioPastel = base / (1 - m / 100);
  const precioPiezas = piezas.reduce((a, p) => a + p.precio, 0);
  const costoPiezas = piezas.reduce((a, p) => a + p.costo, 0);
  const deposito = piezas.reduce((a, p) => a + p.deposito, 0);
  const sugerido = base || precioPiezas ? ceilRed(precioPastel + precioPiezas) : 0;
  const final = num(Q.precioFinal) ?? sugerido;
  const costoTotal = base + costoPiezas;
  const [pmin, pmax] = porcionesEstructura(Q.pisos);
  return { lineas, piezas, ingredientes, indirectos, manoObra, empaque, otros, merma, base, margen: m, precioPastel, precioPiezas, costoPiezas,
    deposito, sugerido, final, costoTotal, utilidad: final - costoTotal, pmin, pmax };
}
function mensajeCliente(Q, c, cliente, folio) {
  const nombre = l => l ? l.r.nombre : null;
  const get = t => c.lineas.find(l => l.tipo === t);
  const deco = c.piezas.map(p => `${p.qty > 1 ? p.qty + ' × ' : ''}${p.r.nombre}${p.modalidad === 'renta' ? ' (en renta)' : ''}`);
  const filas = [

    `Precio: ${money(c.final)}`,

    c.deposito ? `Total a pagar: ${money(c.final + c.deposito)}` : null,
    Q.notas ? '' : null, Q.notas ? `Notas: ${Q.notas}` : null
  ];
  return filas.filter(x => x !== null).join('\n').replace(/\n{3,}/g, '\n\n');
}

async function guardarCotizacion() {
  const Q = S.cot, c = calcCotizacion(Q);
  if (!Q.bizcocho) { toast('err', 'Falta el bizcocho.', 'Elige el sabor antes de guardar.'); irPaso(1); return; }
  const btn = $('#btnGuardarCot'); btn.disabled = true; btn.textContent = 'Guardando…';
  const ahora = new Date(), p2 = n => String(n).padStart(2, '0');
  const folio = Q.folio || `COT-${ahora.getFullYear()}${p2(ahora.getMonth() + 1)}${p2(ahora.getDate())}-${p2(ahora.getHours())}${p2(ahora.getMinutes())}${p2(ahora.getSeconds())}`;
  const r2 = v => Math.round(v * 100) / 100;
  const nombreDe = t => c.lineas.find(l => l.tipo === t)?.r.nombre;
  const descripcion = [descEstructura(Q.pisos), nombreDe('bizcocho') && `bizcocho ${nombreDe('bizcocho')}`, nombreDe('relleno') && `relleno ${nombreDe('relleno')}`,
    nombreDe('betun') && `betún ${nombreDe('betun')}`, ...c.piezas.map(p => `${p.qty} × ${p.r.nombre}${p.modalidad === 'renta' ? ' (renta)' : ''}`)].filter(Boolean).join(', ');
  const cot = { id: Q.id, folio, cliente_id: Q.cliente_id || null, producto: Q.producto.trim() || 'Pastel', porciones: num(Q.porcionesPedidas) || c.pmax, descripcion,
    precio_ingredientes: r2(c.ingredientes), costo_mano_obra: r2(c.manoObra), costo_gas_electricidad: r2(c.indirectos), costo_empaque: r2(c.empaque),
    costo_otros: r2(c.otros), costo_merma: r2(c.merma), costo_piezas: r2(c.costoPiezas), costo_total: r2(c.costoTotal), margen_objetivo: c.margen, precio_sugerido: c.sugerido, precio_cotizado: r2(c.final),
    utilidad_estimada: r2(c.utilidad), deposito_total: r2(c.deposito), estructura: Q.pisos.map(p => ({ diametro: p.d, panes: p.panes })),
    horas_mano_obra: num(Q.horas) || 0, pct_indirectos: Q.pctIndirectos, notas: Q.notas.trim() || null, estado: Q.estado || 'borrador',
    ...(Q.id ? {} : { fecha_cotizacion: `${ahora.getFullYear()}-${p2(ahora.getMonth() + 1)}-${p2(ahora.getDate())}` }) };
  const lineas = [
    ...c.lineas.map(l => ({ tipo: l.tipo, receta_id: l.r.receta_id, concepto: l.r.nombre, cantidad: +l.tandas.toFixed(4), unidad: 'tanda', costo_unitario: Number(l.r.costo_tanda), costo_total: r2(l.costo), porciones: c.pmax })),
    ...c.piezas.map(p => ({ tipo: p.r.tipo, receta_id: p.r.receta_id, concepto: p.r.nombre, cantidad: p.qty, unidad: 'pz', costo_unitario: Number(p.r.costo_tanda), costo_total: r2(p.costo), modalidad: p.modalidad, deposito: r2(p.deposito) })),
    c.indirectos ? { tipo: 'servicios', concepto: `Indirectos ${Q.pctIndirectos}% (gas, luz, moldes)`, cantidad: 1, costo_unitario: r2(c.indirectos), costo_total: r2(c.indirectos) } : null,
    c.manoObra ? { tipo: 'mano_obra', concepto: 'Mano de obra', cantidad: num(Q.horas) || 0, unidad: 'h', costo_unitario: Number(CFG.tarifa_mano_obra_hora), costo_total: r2(c.manoObra) } : null,
    ...Object.entries(Q.empaques || {}).map(([id, q]) => { const e = S.empaques.find(x => x.id === id); return e ? { tipo: 'empaque', empaque_id: id, concepto: e.nombre, cantidad: q, unidad: 'pz', costo_unitario: Number(e.precio), costo_total: r2(Number(e.precio) * q) } : null; }),
    c.otros ? { tipo: 'otro', concepto: 'Otros gastos', cantidad: 1, costo_unitario: r2(c.otros), costo_total: r2(c.otros) } : null,
    c.merma ? { tipo: 'merma', concepto: 'Merma', cantidad: 1, costo_unitario: r2(c.merma), costo_total: r2(c.merma) } : null,
    Math.abs(c.empaque - sumaEmpaques(Q)) > 0.004 ? { tipo: 'empaque', concepto: sumaEmpaques(Q) ? 'Ajuste de empaque' : 'Empaque', cantidad: 1, costo_unitario: r2(c.empaque - sumaEmpaques(Q)), costo_total: r2(c.empaque - sumaEmpaques(Q)) } : null
  ].filter(Boolean);
  try {
    const g = await api.guardarCotizacion(cot, lineas);
    toast('ok', 'Cotización guardada.', `${folio} · ${money(c.final)}`);
    borrarBorrador(); verCotizacion(g.id);
  } catch (x) { toast('err', 'No se pudo guardar.', x.message); btn.disabled = false; btn.textContent = 'Guardar cotización'; }
}

async function editarMoldes() {
  const filas = () => [...S.moldes].sort((a, b) => a.diametro_cm - b.diametro_cm).map(m => `
    <div class="molde-row" data-mid="${esc(m.id)}"><span><b>${fmtN(m.diametro_cm)} cm</b></span>
      <div class="inp"><input data-min inputmode="numeric" value="${m.porciones_min}"></div><span class="muted">a</span>
      <div class="inp"><input data-max inputmode="numeric" value="${m.porciones_max}"></div><span class="muted small">porc.</span>
      <button type="button" class="x" data-del aria-label="Quitar molde">×</button></div>`).join('');
  const p = abrirModal('Tabla de moldes', `
    <p class="muted small" style="margin:-6px 0 0">Porciones que salen de cada molde a altura normal (2 panes). Con 4 panes salen el doble.</p>
    <div id="moldesRows">${filas()}</div>
    <div class="molde-row"><div class="inp"><input id="mNuevoD" inputmode="decimal" placeholder="Molde"><span class="affix">cm</span></div>
      <div class="inp"><input id="mNuevoMin" inputmode="numeric" placeholder="min"></div><span class="muted">a</span>
      <div class="inp"><input id="mNuevoMax" inputmode="numeric" placeholder="máx"></div><span class="muted small">porc.</span><span></span></div>`, 'Guardar tabla');
  const form = abrirModal.ultimo;
  form.querySelector('#moldesRows').onclick = async ev => {
    const b = ev.target.closest('[data-del]'); if (!b) return;
    const row = b.closest('[data-mid]');
    try { await api.borrarMolde(row.dataset.mid); S.moldes = S.moldes.filter(m => m.id !== row.dataset.mid); row.remove(); } catch (x) { form.error(x.message); }
  };
  form.onsubmit = async ev => {
    ev.preventDefault();
    const cambios = [...form.querySelectorAll('[data-mid]')].map(row => { const m = S.moldes.find(x => x.id === row.dataset.mid); return { m, min: num(row.querySelector('[data-min]').value), max: num(row.querySelector('[data-max]').value) }; });
    if (cambios.some(c => !(c.min > 0) || !(c.max >= c.min))) return form.error('Revisa las porciones: el mínimo debe ser mayor que cero y el máximo igual o mayor.');
    const d = num(form.querySelector('#mNuevoD').value), mn = num(form.querySelector('#mNuevoMin').value), mx = num(form.querySelector('#mNuevoMax').value);
    if (d != null && (!(d > 0) || !(mn > 0) || !(mx >= mn))) return form.error('Para agregar un molde escribe su medida y sus porciones.');
    if (d != null && S.moldes.some(m => Number(m.diametro_cm) === d)) return form.error(`El molde de ${d} cm ya está en la tabla.`);
    try {
      for (const c of cambios) if (c.min !== Number(c.m.porciones_min) || c.max !== Number(c.m.porciones_max)) Object.assign(c.m, await api.guardarMolde({ id: c.m.id, diametro_cm: c.m.diametro_cm, porciones_min: c.min, porciones_max: c.max }));
      if (d != null) S.moldes.push(await api.guardarMolde({ diametro_cm: d, porciones_min: mn, porciones_max: mx }));
      toast('ok', 'Tabla de moldes guardada.', ''); form.cerrar(true);
    } catch (x) { form.error(x.message); }
  };
  await p;
  if (S.cot && $('#pasoBox')) { renderPaso(); renderResumenCot(); }
}

/* ===== Calendario de producción ===== */
const ETAPAS = { compra: 'Comprar', horneado: 'Hornear', preparacion: 'Rellenos y betún', decoracion: 'Decorar', empaque: 'Empacar', entrega: 'Entregar' };
function lunesDe(iso) { const d = new Date(iso + 'T12:00:00'); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return d.toISOString().slice(0, 10); }
async function renderCalendario() {
  const ini = S.semana || lunesDe(hoyISO()), fin = sumarDias(ini, 6);
  $('#app').innerHTML = '<p class="muted">Cargando…</p>';
  const tareas = (await api.tareas(ini, fin)).filter(t => t.pedidos && t.pedidos.estado !== 'cancelado');
  const cotIds = [...new Set(tareas.map(t => t.pedidos.cotizacion_id).filter(Boolean))];
  const det = cotIds.length ? await api.detalleDe(cotIds) : [];
  const detDe = (cid, tipos) => det.filter(d => d.cotizacion_id === cid && tipos.includes(d.tipo));
  const QUE = { horneado: ['bizcocho'], preparacion: ['relleno', 'betun'], decoracion: ['topper', 'decoracion'], empaque: ['empaque'] };
  // Ingredientes que se necesitan para hornear y preparar esta semana (tareas pendientes)
  const porHacer = tareas.filter(t => t.estado !== 'completado' && (t.etapa === 'horneado' || t.etapa === 'preparacion'));
  const usos = porHacer.flatMap(t => detDe(t.pedidos.cotizacion_id, QUE[t.etapa]).filter(d => d.receta_id).map(d => ({ receta_id: d.receta_id, tandas: Number(d.cantidad) })));
  const lineas = usos.length ? await api.lineasDe([...new Set(usos.map(u => u.receta_id))]) : [];
  const nec = {};
  usos.forEach(u => lineas.filter(l => l.receta_id === u.receta_id).forEach(l => {
    const ing = S.ingredientes.find(i => i.id === l.ingrediente_id); if (!ing) return;
    const c = convertir(Number(l.cantidad) * u.tandas, l.unidad, ing.unidad); if (c == null) return;
    nec[ing.id] = (nec[ing.id] || 0) + c;
  }));
  const compras = Object.entries(nec).map(([id, cant]) => { const i = S.ingredientes.find(x => x.id === id); const tiene = Number(i.existencia) || 0; const falta = Math.max(0, cant - tiene);
    return { i, cant, tiene, falta, costo: i.cantidad_presentacion ? falta / Number(i.cantidad_presentacion) * Number(i.precio_actual) : 0 }; }).sort((a, b) => a.i.nombre.localeCompare(b.i.nombre));
  const fmtCant = (v, u) => (u === 'g' || u === 'ml') && v >= 1000 ? `${fmtN(v / 1000, 2)} ${u === 'g' ? 'kg' : 'l'}` : `${fmtN(v, 1)} ${u}`;
  const hoy = hoyISO();
  const dias = Array.from({ length: 7 }, (_, k) => sumarDias(ini, k));
  const txtLista = compras.filter(x => x.falta > 0).map(x => `- ${x.i.nombre}: ${fmtCant(x.falta, x.i.unidad)}`).join('\n');
  $('#app').innerHTML = `
  <div class="head"><div><span class="muted small">Semana del ${esc(fechaCorta(ini))} al ${esc(fechaCorta(fin))}</span><h1>Calendario</h1></div>
    <div style="display:flex;gap:6px"><button class="btn btn-secondary btn-sm" data-sem="-7">← Anterior</button><button class="btn btn-ghost btn-sm" data-sem="0">Hoy</button><button class="btn btn-secondary btn-sm" data-sem="7">Siguiente →</button></div></div>
  <div class="cal">${dias.map(d => { const ts = tareas.filter(t => t.fecha_programada === d).sort((a, b) => (a.hora_programada || '').localeCompare(b.hora_programada || '')); return `
    <section class="cal-dia ${d === hoy ? 'hoy' : ''}"><h3>${esc(fechaLarga(d))}</h3>
      ${ts.length ? ts.map(t => { const items = detDe(t.pedidos.cotizacion_id, QUE[t.etapa] || []); return `
        <label class="tarea ${t.estado === 'completado' ? 'hecha' : ''} et-${t.etapa}">
          <input type="checkbox" data-tid="${esc(t.id)}" ${t.estado === 'completado' ? 'checked' : ''}>
          <span><b>${ETAPAS[t.etapa] || esc(t.etapa)}</b> · ${esc(t.pedidos.producto)}${t.pedidos.clientes?.nombre ? ' · ' + esc(t.pedidos.clientes.nombre) : ''}
            ${t.etapa === 'entrega' ? `<small>${esc((t.hora_programada || '').slice(0, 5))} h</small>` : ''}
            ${items.length ? `<small>${items.map(it => `${esc(it.concepto)}${it.unidad === 'tanda' ? ' × ' + fmtN(it.cantidad, 2) + (Number(it.cantidad) === 1 ? ' tanda' : ' tandas') : it.cantidad > 1 ? ' × ' + fmtN(it.cantidad) : ''}`).join(' · ')}</small>` : ''}</span>
        </label>`; }).join('') : '<p class="muted small" style="margin:0">Sin tareas</p>'}
    </section>`; }).join('')}</div>
  <section class="panel" style="margin-top:20px">
    <div class="head" style="margin-bottom:8px"><div><h2>Ingredientes para hornear y preparar esta semana</h2><span class="muted small">Según las recetas de los pedidos con tareas pendientes.</span></div>
      ${txtLista ? '<button class="btn btn-secondary btn-sm" id="copiarLista">Copiar lista de compras</button>' : ''}</div>
    ${compras.length ? `<table class="det"><thead><tr><th>Ingrediente</th><th>Se necesita</th><th>Tienes</th><th>Comprar</th><th style="text-align:right">Costo aprox.</th></tr></thead><tbody>
      ${compras.map(x => `<tr><td>${esc(x.i.nombre)}</td><td class="num">${fmtCant(x.cant, x.i.unidad)}</td><td class="num muted">${x.tiene ? fmtCant(x.tiene, x.i.unidad) : '—'}</td><td class="num"><b>${x.falta > 0 ? fmtCant(x.falta, x.i.unidad) : '✓'}</b></td><td class="num" style="text-align:right">${x.falta > 0 ? money(x.costo) : ''}</td></tr>`).join('')}
      <tr><td colspan="4"><b>Total aproximado</b></td><td class="num" style="text-align:right"><b>${money(compras.reduce((a, x) => a + x.costo, 0))}</b></td></tr></tbody></table>
      <p class="sug" style="margin-top:8px">"Tienes" usa la existencia de cada insumo; cuando se registren compras y consumos se descontará solo.</p>`
    : '<p class="muted small" style="margin:0">No hay horneados ni preparaciones pendientes esta semana.</p>'}
  </section>`;
  document.querySelectorAll('[data-sem]').forEach(b => b.onclick = () => { const n = Number(b.dataset.sem); S.semana = n ? sumarDias(ini, n) : lunesDe(hoyISO()); renderCalendario(); });
  document.querySelectorAll('[data-tid]').forEach(cb => cb.onchange = async () => {
    const est = cb.checked ? 'completado' : 'pendiente';
    try { await api.estadoTarea(cb.dataset.tid, est); renderCalendario(); } catch (x) { cb.checked = !cb.checked; toast('err', 'No se pudo actualizar.', x.message); }
  });
  const cl = $('#copiarLista'); if (cl) cl.onclick = async () => { try { await navigator.clipboard.writeText(`Lista de compras (${fechaCorta(ini)} al ${fechaCorta(fin)})\n${txtLista}`); toast('ok', 'Lista copiada.', 'Pégala en WhatsApp o en tus notas.'); } catch { toast('err', 'No se pudo copiar.', ''); } };
}

async function editarEmpaque(emp) {
  let blob = null, preview = null, quitar = false;
  const p = abrirModal(emp ? 'Editar empaque' : 'Nuevo empaque', `
    <div class="pz-top" style="grid-template-columns:120px minmax(0,1fr)">
      <div class="foto-box" id="empFoto"></div>
      <div style="display:flex;flex-direction:column;gap:12px;min-width:0">
        <div class="field"><label for="emNombre">Nombre</label><div class="inp"><input id="emNombre" value="${esc(emp?.nombre || '')}" placeholder="Ej. Caja 25 cm con ventana"></div></div>
        <div class="field"><label for="emPrecio">Precio</label><div class="inp"><span class="affix">$</span><input id="emPrecio" inputmode="decimal" value="${esc(emp?.precio ?? '')}" placeholder="0.00"></div></div>
      </div>
    </div>
    <div class="field"><label for="emDesc">Descripción <span class="muted" style="font-weight:400">(opcional)</span></label><div class="inp"><textarea id="emDesc" placeholder="Medidas, color, material…">${esc(emp?.descripcion || '')}</textarea></div></div>
    ${emp ? '<button type="button" class="btn btn-danger btn-sm" id="emBorrar" style="align-self:flex-start">Eliminar empaque</button>' : ''}`, emp ? 'Guardar cambios' : 'Guardar empaque');
  const form = abrirModal.ultimo;
  const pintaFoto = () => {
    const url = preview || (!quitar && emp && S.fotos[emp.foto_path]) || null;
    form.querySelector('#empFoto').innerHTML = `<label class="foto-drop" for="emFotoIn" style="width:120px;height:120px">${url ? `<img src="${esc(url)}" alt="">` : '<span class="foto-ph"><b>+ Foto</b><small>opcional</small></span>'}</label>
      <input type="file" id="emFotoIn" accept="image/*" hidden>${url ? '<button type="button" class="btn btn-ghost btn-sm" id="emQuitar">Quitar foto</button>' : ''}`;
    form.querySelector('#emFotoIn').onchange = async ev => { const f = ev.target.files[0]; if (!f) return; try { blob = await reducirImagen(f); preview = URL.createObjectURL(blob); quitar = false; pintaFoto(); } catch { form.error('No se pudo usar esa imagen.'); } };
    const q = form.querySelector('#emQuitar'); if (q) q.onclick = () => { blob = null; preview = null; quitar = true; pintaFoto(); };
  };
  pintaFoto();
  const b = form.querySelector('#emBorrar');
  if (b) b.onclick = async () => {
    if (!confirm(`¿Eliminar el empaque "${emp.nombre}"?`)) return;
    try { await api.borrarEmpaque(emp.id); if (emp.foto_path) api.borrarFoto(emp.foto_path).catch(() => {}); S.empaques = S.empaques.filter(x => x.id !== emp.id); toast('ok', 'Empaque eliminado.', ''); form.cerrar(true); }
    catch (x) { form.error(x.message); }
  };
  form.onsubmit = async ev => {
    ev.preventDefault();
    const nombre = form.querySelector('#emNombre').value.trim(), precio = num(form.querySelector('#emPrecio').value), descripcion = form.querySelector('#emDesc').value.trim() || null;
    if (!nombre) return form.error('Escribe el nombre del empaque.');
    if (!(precio >= 0) || precio == null) return form.error('Escribe el precio del empaque.');
    const btn = form.querySelector('[type=submit]'); btn.disabled = true;
    try {
      let e = await api.guardarEmpaque({ id: emp?.id, nombre, precio, descripcion });
      const anterior = emp?.foto_path;
      if (blob) { const path = await api.subirFoto('empaque-' + e.id, blob); e = await api.guardarEmpaque({ id: e.id, foto_path: path }); S.fotos[path] = preview; if (anterior && anterior !== path) api.borrarFoto(anterior).catch(() => {}); }
      else if (quitar && anterior) { e = await api.guardarEmpaque({ id: e.id, foto_path: null }); api.borrarFoto(anterior).catch(() => {}); }
      const i = S.empaques.findIndex(x => x.id === e.id); if (i >= 0) S.empaques[i] = e; else S.empaques.push(e);
      S.empaques.sort((a, b) => a.nombre.localeCompare(b.nombre));
      toast('ok', 'Empaque guardado.', `${nombre} · ${money(precio)}`); form.cerrar(e);
    } catch (x) { form.error(x.message); btn.disabled = false; }
  };
  return p;
}

const llaveBorrador = () => 'recetario.borrador.' + (DEMO ? 'demo' : (S.user?.email || ''));
function guardarBorrador() { try { if (S.cot) localStorage.setItem(llaveBorrador(), JSON.stringify(S.cot)); } catch {} }
function borrarBorrador() { S.cot = null; try { localStorage.removeItem(llaveBorrador()); } catch {} }
function leerBorrador() { try { const v = localStorage.getItem(llaveBorrador()); return v ? JSON.parse(v) : null; } catch { return null; } }
function crearDesdeCot(kind, tipo) {
  S.retornoCot = { kind, tipo }; guardarBorrador();
  if (kind === 'pieza') S.filtroP = tipo; else S.filtroR = tipo;
  openEditor(null, kind);
}
async function volverACot(r) {
  const ret = S.retornoCot; S.retornoCot = null;
  $('#app').innerHTML = '<p class="muted">Cargando…</p>';
  await loadRecetas();
  if (r && ret && S.cot) {
    const nueva = S.recetas.find(x => x.receta_id === r.id);
    if (nueva && ret.kind === 'pieza' && ES_PIEZA(nueva.tipo)) {
      S.cot.piezas[nueva.receta_id] = { qty: 1, modalidad: nueva.se_renta ? 'renta' : 'venta' };
      S.cot.paso = nueva.tipo === 'topper' ? 4 : 5;
    } else if (nueva && ['bizcocho', 'relleno', 'betun'].includes(nueva.tipo)) {
      S.cot[nueva.tipo] = nueva.receta_id; S.cot.paso = ['bizcocho', 'relleno', 'betun'].indexOf(nueva.tipo) + 1;
    }
  }
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === 'cotizaciones'));
  renderCotizador(); window.scrollTo(0, 0);
}

  if (CATALOGO[view]) S.ultimoCat = view;
  S.view = view; S.retornoCot = null;
  const principal = CATALOGO[view] ? 'catalogo' : view;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === principal));
  $('#app').innerHTML = '<p class="muted">Cargando…</p>';
  try {
    await loadRecetas();
    if (view === 'cotizaciones') { S.cotizaciones = await api.cotizaciones(); renderCotizaciones(); }
    else if (view === 'config') renderConfig();
    else if (view === 'empaques') renderEmpaques();
    else if (view === 'clientes') renderClientes();
    else if (view === 'pedidos') { S.pedidos = await api.pedidos(); renderPedidos(); }
    else if (view === 'calendario') await renderCalendario();
    else view === 'insumos' ? renderInsumos() : view === 'piezas' ? renderPiezas() : renderRecetas();
    if (CATALOGO[view]) {
      $('#app').insertAdjacentHTML('afterbegin', `<nav class="subnav">${Object.entries(CATALOGO).map(([k, v]) => `<button class="subtab" data-sub="${k}" aria-current="${k === view}">${v}</button>`).join('')}</nav>`);
      document.querySelectorAll('[data-sub]').forEach(b => b.onclick = () => go(b.dataset.sub));
    }
    if (S.cot) { $('#app').insertAdjacentHTML('afterbegin', avisoBorrador()); bindAvisoBorrador(); }
  } catch (x) {
    $('#app').innerHTML = `<div class="note note-err" role="alert"><b>No se pudo cargar.</b><span>${esc(x.message)}</span></div>`;
  }
  window.scrollTo(0, 0);
}
function start() {
  $('#topbar').hidden = false;
  $('#userEmail').textContent = (DEMO ? 'Demostración · ' : '') + (S.user?.email || '');
  if (!S.cot) S.cot = leerBorrador();
  if (S.cot) { S.cot.empaques = S.cot.empaques || {}; S.cot.piezas = S.cot.piezas || {}; }
  go('cotizaciones');
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => go(t.dataset.view));
$('#btnConfig').onclick = () => go('config');
$('#btnSalir').onclick = async () => { await api.signOut(); S.user = null; renderLogin(); };
(async () => {
  if (!DEMO && !window.supabase) { $('#app').innerHTML = '<div class="note note-err"><b>Sin conexión.</b><span>No se pudo cargar la librería de Supabase. Revisa tu internet y recarga.</span></div>'; return; }
  const recuperando = /type=recovery/.test(location.hash);
  api.alRecuperar(() => renderLogin(null, 'nueva'));
  S.user = await api.session();
  if (recuperando && S.user) return renderLogin(null, 'nueva');
  S.user ? start() : renderLogin();
})();
</script>
</body>
</html>
